<a class="link-card" href="{{ .Get "url" }}" target="_blank" rel="noopener noreferrer">
  <div class="link-card-inner">
    <span class="link-card-title">{{ .Get "title" }}</span>
    <span class="link-card-desc">{{ .Get "desc" }}</span>
    <span class="link-card-url">{{ .Get "url" }}</span>
  </div>
</a>
